name: Deploy Micronaut to GitHub Pages

on:
  push:
    branches:
      - main  # Change to your main branch if different

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        # Java distribution. See the list of supported distributions in README file
        distribution: temurin

    - name: Build Micronaut application
      run: ./gradlew build  # Adjust if using Maven

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/resources/main  # Adjust if necessary
        publish_branch: gh-pages
