version: '3.8'
services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwe
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    image: 'customer:latest'
    build:
      context: .
    ports:
      - "8080:8080"
    depends_on:
      - db
    links:
      - db
    environment:
      JDBC_URL: jdbc:postgresql://db:5432/time
      JDBC_HOST: db
      JDBC_PORT: 5432
      JDBC_USER: postgres
      JDBC_PASSWORD: qwe
      JDBC_DB: postgres
volumes:
  pgdata:

